; ESP32-S3 LED controller (rev 0.2): Wi-Fi, web UI and WS2812B driver for OUT1-OUT4.
; Settings match firmware/docs/PROGRAMMING_GUIDE.md. Serial console is the native USB (USB-C, J6).
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
; for N8R8 modules, uncomment:
; board_build.arduino.memory_type = qio_opi
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
monitor_speed = 115200
; Native USB: DTR/RTS act as BOOT/RST. Leave them low so opening the monitor
; does not reset the chip into download mode.
monitor_dtr = 0
monitor_rts = 0
lib_deps =
    fastled/FastLED@^3.9.0
    bblanchon/ArduinoJson@^7.2.0
